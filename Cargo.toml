
# =============================================================================
# QANTO PROTOCOL - Virtual Workspace Manifest
# =============================================================================
# This is the master workspace configuration for the Qanto blockchain protocol.
# All crate packages live under Protocol_Core/ and Scripts/.
# =============================================================================

[workspace]
resolver = "2"
members = [
    "Protocol_Core/qanto-consensus-primitives",
    "Protocol_Core/qanto-node",
    "Protocol_Core/qanto-core",
    "Protocol_Core/qanto-rpc",
    "Protocol_Core/myblockchain",
    "Protocol_Core/qanto-zk-sdk",
    "Protocol_Core/qanto-relayer",
    "Scripts/tools/relayer",
    "qanto-desktop-wallet/src-tauri",
]

# Force secure versions to override transitive dependencies
[workspace.dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
mimalloc = { version = "0.1" }
ahash = { version = "0.8", features = ["serde"] }
# Security patches for transitive dependencies - force secure versions
quick-xml = { version = "0.41.0" }
quinn-proto = { version = "0.11.15" }
rustls-webpki = { version = "0.103.13" }
ring = { version = "0.17.12" }
hickory-proto = { version = "0.26.1" }
hickory-resolver = { version = "0.26.1" }
rustls = { version = "0.23" }
# RUSTSEC-2026-0258: h2 unbounded empty DATA frames — force >=0.4.16
h2 = { version = "0.4.16" }

# Compatibility overrides that still carry local source/API changes.
[patch.crates-io]
# Override ark-relations with a local patched manifest that depends on tracing-subscriber 0.3.20
ark-relations = { path = "patches/ark-relations" }
# Keep the libp2p DNS patches until their hickory 0.26 API updates are available upstream.
libp2p-dns = { path = "patches/libp2p-dns" }
libp2p-mdns = { path = "patches/libp2p-mdns" }

# --- Build Profiles ---
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
incremental = false

[profile.dev]
opt-level = 1
